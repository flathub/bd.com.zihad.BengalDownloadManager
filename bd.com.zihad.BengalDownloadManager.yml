app-id: bd.com.zihad.BengalDownloadManager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: bengal-download-manager

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher

modules:
  - python3-requirements.yml

  - name: bengal-download-manager
    buildsystem: cmake
    sources:
      - type: archive
        url: https://github.com/tazihad/bengal-download-manager/archive/refs/tags/v0.3.11.tar.gz
        sha256: 1f80d5982fe89a0cf26f9592c4b7d865ec2caeadcfc1617e3a64bcd45b1f012f
